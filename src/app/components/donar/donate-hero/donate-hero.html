<section class="donate-hero">
  <div class="donate-hero__inner">
    <div class="donate-hero__kicker">
      <span class="dot"></span>Colabora con nosotros
    </div>
    <h1 class="donate-hero__title">
      Ayúdanos a<br/>construir <em>esperanza</em>.
    </h1>
    <p class="donate-hero__lede">
      Hay muchas formas de ayudar a las aves de Málaga. Elige la tuya
      y forma parte del primer centro de recuperación de fauna silvestre
      de la provincia
    </p>
    <div class="donate-hero__nav">
      <button type="button" class="donate-hero__pill" (click)="scrollToSection('socio')">Hazte socio</button>
      <button type="button" class="donate-hero__pill" (click)="scrollToSection('donativos')">Donativos</button>
      <button type="button" class="donate-hero__pill" (click)="scrollToSection('teaming')">Teaming</button>
      <button type="button" class="donate-hero__pill" (click)="scrollToSection('voluntariado')">Voluntariado</button>
    </div>
  </div>
</section>
